# Profile: local development, Granite 4.2 8B served by Ollama on this machine.
#
# These are the same values as the defaults in src/coboltutor_backend/config.py,
# so you only need this file to switch back after loading another profile in
# the same shell, or as a starting point for your own changes:
#
#   set -a; source profiles/local-ollama.conf; set +a
#   uv run coboltutor-backend
#
# (`set -a` exports every variable the file sets, so the backend process sees them.)
#
# Docker Compose doesn't read this file: docker-compose.yml sets the same
# values itself, pointing at the "ollama" container instead of localhost.
#
# NO SECRETS IN THIS FILE. It's committed to the repo. Ollama doesn't need a
# real API key, so the default placeholder key in config.py is fine here.

# Ollama's OpenAI-compatible API.
COBOLTUTOR_LLM_BASE_URL=http://localhost:11434/v1
# Ollama's tag for the model. Native Ollama installs made by install.sh use
# coboltutor-granite4.2:8b instead (the same weights with a 16k context; see
# ollama/Modelfile).
COBOLTUTOR_LLM_MODEL=granite4.2:8b
# Ollama maps this to Granite's thinking mode; "low" keeps answers fast.
COBOLTUTOR_LLM_REASONING_EFFORT=low
