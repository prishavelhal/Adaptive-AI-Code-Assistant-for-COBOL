# Profile: OSU CoE HPC cluster, Granite 4.2 30B served by vLLM in a Slurm job.
#
# Two scripts read this file, so the settings for the model server and the
# backend that talks to it can't drift apart:
#   scripts/cluster/serve-vllm.sbatch  - reads the VLLM_* settings and
#                                        COBOLTUTOR_LLM_MODEL (the name vLLM serves the model under)
#   scripts/cluster/run-backend.sh     - reads the COBOLTUTOR_* settings
#
# The settings NOT in this file, because they change per run or are secret:
#   - The vLLM address (node + port). The Slurm job writes it to
#     ~/.config/coboltutor/vllm-endpoint when it starts, and run-backend.sh reads it.
#   - The API key. It lives in ~/.config/coboltutor/vllm.env, created by
#     scripts/cluster/setup.sh, outside the repo.
#
# NO SECRETS IN THIS FILE. It's committed to the repo.
# Walkthrough: docs/cluster-support.md.

# --- vLLM server (read by serve-vllm.sbatch) --------------------------------

VLLM_MODEL_ID=ibm-granite/granite-4.2-30b
# Context window in tokens (prompt + answer). config.py's prompt-size limits
# are sized for a 16k window, which is enough for one /api/chat call. The agent
# pipeline needs more: the Critic's review prompt holds the code (up to ~8k
# tokens), the structural analysis, AND the Explainer's whole answer, plus the
# llm_max_tokens (6144) reserved for its reply. With a long file that passes
# 16k, vLLM rejects the request, and the Critic silently skips its review
# ("reviewed_by_model": false). Granite 4.2 supports 131072 tokens; 32k fixes
# the overflow and still leaves room for many requests at once on an H200.
# On a smaller GPU, lowering this frees KV-cache memory.
VLLM_MAX_MODEL_LEN=32768
# Share of the GPU's memory vLLM may use for weights + KV cache.
VLLM_GPU_MEMORY_UTILIZATION=0.95
# Any other `vllm serve` flags, space-separated. Examples:
#   --tensor-parallel-size 2   split the model across 2 GPUs (also request
#                              2 GPUs in serve-vllm.sbatch: --gres=gpu:2)
#   --quantization fp8_per_tensor --kv-cache-dtype fp8
#                              halve weight and KV-cache memory so 30B fits on
#                              a 40-48 GB GPU (costs a little answer quality)
#   --reasoning-parser <name>  needed if Granite's "thinking" text shows up in
#                              answers; pick the parser the model card names
# Record whatever you use with your evaluation results: changing these changes
# the model's output, so scores from different settings aren't comparable.
#
# Default: full precision (bf16, the model's native format), no fp8. The 30B
# weights take ~60 GB, which an 80 GB H100 or a 141 GB H200 holds with plenty
# left for the KV cache, so quantizing would only lower quality. Add the fp8
# flags above only on a smaller GPU.
VLLM_EXTRA_ARGS="--reasoning-parser nemotron_v3"

# --- Backend (read by run-backend.sh) ---------------------------------------

# The name the backend asks for. serve-vllm.sbatch passes this to vLLM as
# --served-model-name, so /health's "model_ready" check finds it.
COBOLTUTOR_LLM_MODEL=granite4.2:30b
# How much Granite "thinks" before answering (see llm_reasoning_effort in
# config.py). vLLM 0.34 with the nemotron_v3 reasoning parser accepts it.
# Do NOT leave it empty here: empty omits the field, and then the 30B model
# thinks without limit. Measured on "explain PAYROLL.cbl section by section"
# (H200, bf16, max_tokens 6144):
#   empty  - all 6144 tokens spent thinking, no answer at all (error)
#   none   - 0 thinking, 5071-token answer, 85 s
#   low    - 7 thinking, 1906-token answer, 32 s
#   medium - 412 thinking, 4758-token answer, 87 s
# "low" matches the laptop default (local-ollama.conf), so both setups behave
# alike. Try "medium" if answers seem too brief, but re-test the timings.
COBOLTUTOR_LLM_REASONING_EFFORT=low
# Agent pipeline (/api/agent-chat): let the Critic agent ask the model to
# review every answer for factual mistakes, as a second model call after the
# answer streams. It's off by default because on a laptop that call adds
# several seconds; on a cluster GPU it's quick. See agents/settings.py.
# run-backend.sh exports every setting in this file, so the backend's
# AgentSettings (env prefix COBOLTUTOR_AGENT_) picks this up.
COBOLTUTOR_AGENT_LLM_REVIEW=true
# The Advanced Desktop node is shared with other users. Listen on 127.0.0.1
# only, so nobody else on the node can use your backend (and your GPU job).
# VS Code runs on the same node, so it can still reach it.
COBOLTUTOR_HOST=127.0.0.1
